name: Build APK

# Release automation
# ------------------
# Triggers:
#   - push to master           -> build + publish a GitHub Release automatically
#   - pull_request to master   -> build only (arm64 artifact, no release)
#   - workflow_dispatch        -> manual build + release; `release_tag` overrides the
#                                 computed tag (e.g. v2.4.0-plus), empty = automatic
#
# Version algorithm (.github/scripts/compute-version.sh, tested by
# compute-version-test.sh; no commit is written back to the repo, so a release can
# never retrigger itself). github.run_number is NOT used anywhere: PR runs consume
# run numbers too, so releases anchored on it would skip numbers.
#   Release (push / dispatch): N = highest N in existing v2.3.5.N-plus tags + 1
#                              (no tags -> N = 1)
#                              versionCode = 746 + N, versionName = 2.3.5.<N>-plus,
#                              release tag = v<versionName>
#   PR build (never released): versionCode = 746 + last released N,
#                              versionName = 2.3.5.<last N>-pr.<sha>-plus
# Example: with v2.3.5.3-plus released, the next master push is always
# v2.3.5.4-plus / versionCode 750, no matter how many PRs ran in between.
# The in-app updater compares versions with VersionUtil, which strips everything
# after '-'/'+'. The growing 4th numeric segment keeps releases strictly ordered;
# a PR versionName reuses the last released segment, so a sideloaded PR build never
# reads newer than the real releases. Both checkouts keep fetch-depth 0 +
# fetch-tags so the tag scan sees every release.
#
# Signing:
#   - With APP_KEYSTORE_BASE64 / APP_KEYSTORE_PASSWORD / APP_KEYSTORE_ALIAS /
#     APP_KEY_PASSWORD secrets set, release APKs are signed with that keystore.
#   - Without them the build falls back to the committed V2rayNG/debug.keystore and
#     the Release is marked prerelease with a warning in the body (a debug-signed
#     APK cannot update an install signed with the real key).
#   - GPG_PRIVATE_KEY is optional: when absent the .sig files are simply skipped.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Explicit release tag (e.g. v2.4.0-plus). Empty = computed from run number.'
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      signed: ${{ steps.keystore.outputs.signed }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'
        # Release tags anchor the version computation below; fetch-depth 0 already
        # brings them in, this simply keeps that guaranteed if the depth changes.
        fetch-tags: 'true'

    # Releases count up from the existing v2.3.5.N-plus tags; PR builds reuse the
    # last released N with a -pr.<sha> marker. run_number is not involved, so PR
    # runs can no longer punch holes into the release numbering. The script is
    # covered by .github/scripts/compute-version-test.sh (plain bash, no repo needed).
    - name: Compute version
      id: version
      env:
        EVENT_NAME: ${{ github.event_name }}
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        COMMIT_SHA: ${{ github.sha }}
      run: bash .github/scripts/compute-version.sh

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5.7.0
      with:
        distribution: 'temurin'
        java-version: '21'

    # Release keystore secrets are optional: without them the committed debug
    # keystore signs the build and the Release is marked prerelease.
    - name: Detect release keystore secrets
      id: keystore
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$APP_KEYSTORE_BASE64" ] && [ -n "$APP_KEYSTORE_PASSWORD" ] \
          && [ -n "$APP_KEYSTORE_ALIAS" ] && [ -n "$APP_KEY_PASSWORD" ]; then
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release keystore secrets found: producing release-signed APKs."
        else
          echo "signed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Release keystore secrets missing; falling back to the committed debug keystore. The Release will be marked prerelease."
        fi

    - name: Decode release keystore
      if: steps.keystore.outputs.signed == 'true'
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        printf '%s' "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release_keystore.jks"

    - name: Prepare Gradle
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport \
          -PndkVersion=29.0.14206865 \
          -PversionCode=${{ steps.version.outputs.version_code }} \
          -PversionName=${{ steps.version.outputs.version_name }}

    # PR builds only need one ABI for a smoke check; master/dispatch builds keep the
    # full ABI split (arm64-v8a, armeabi-v7a, x86, x86_64) plus the universal APK.
    - name: Select ABIs
      id: abis
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "gradle_args=-PABI_FILTERS=arm64-v8a" >> "$GITHUB_OUTPUT"
        else
          echo "gradle_args=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build APK (release keystore)
      if: steps.keystore.outputs.signed == 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assembleRelease \
          -PndkVersion=29.0.14206865 \
          -PversionCode=${{ steps.version.outputs.version_code }} \
          -PversionName=${{ steps.version.outputs.version_name }} \
          ${{ steps.abis.outputs.gradle_args }} \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release_keystore.jks" \
          -Pandroid.injected.signing.store.password='${{ secrets.APP_KEYSTORE_PASSWORD }}' \
          -Pandroid.injected.signing.key.alias='${{ secrets.APP_KEYSTORE_ALIAS }}' \
          -Pandroid.injected.signing.key.password='${{ secrets.APP_KEY_PASSWORD }}'

    - name: Build APK (debug keystore fallback)
      if: steps.keystore.outputs.signed != 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assembleRelease \
          -PndkVersion=29.0.14206865 \
          -PversionCode=${{ steps.version.outputs.version_code }} \
          -PversionName=${{ steps.version.outputs.version_name }} \
          ${{ steps.abis.outputs.gradle_args }} \
          -Pandroid.injected.signing.store.file="${{ github.workspace }}/V2rayNG/debug.keystore" \
          -Pandroid.injected.signing.store.password=android \
          -Pandroid.injected.signing.key.alias=androiddebugkey \
          -Pandroid.injected.signing.key.password=android

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && github.event_name != 'pull_request' }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && github.event_name != 'pull_request' }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() && github.event_name != 'pull_request' }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  # Publishes a GitHub Release for every push to master and for manual dispatches.
  # PR builds stop at the artifact stage above.
  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Collect release files
        run: |
          mkdir -p release-files
          find release -type f -name '*.apk' -exec cp {} release-files/ \;
          ls -la release-files/

      # Optional: sign the APKs with GPG. Skipped (not failed) when the secret is absent.
      # The secrets context is not reliable inside step `if:` expressions, so the
      # presence check runs inside a step (via env) and publishes an output instead.
      - name: Detect GPG signing key
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "GPG_PRIVATE_KEY secret not set; skipping .sig files."
          fi

      - name: GPG sign APK files
        if: steps.gpg.outputs.has_key == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          if [ -z "$KEY" ]; then
            echo "::warning::GPG key import produced no secret key; skipping .sig files."
            exit 0
          fi
          find release-files -type f -name '*.apk' | while read apk; do
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "${apk}.sig" "$apk"
          done
          gpg --armor --export "$KEY" > release-files/v2rayNG-Plus-public-key.asc

      - name: Generate release notes
        env:
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          LAST_TAG=$(git tag --list 'v*plus*' --sort=-creatordate | grep -v "^${RELEASE_TAG}$" | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
            SINCE_LABEL="$LAST_TAG"
          else
            RANGE="HEAD~20..HEAD"
            SINCE_LABEL="the last 20 commits"
          fi
          COMMITS=$(git log $RANGE --no-merges --pretty='- %s (%h)' 2>/dev/null || git log -20 --no-merges --pretty='- %s (%h)')

          {
            echo "## v2rayNG-Plus ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo
            echo "自动构建：GitHub Actions 在推送到 \`master\` 后自动编译并发布本 Release。"
            echo "Automated build: published by GitHub Actions after a push to \`master\`."
            echo
            if [ "$SIGNED" != "true" ]; then
              echo "> ⚠️ **中文**：本次构建使用仓库内 debug 签名（未配置正式签名 secrets），**不能覆盖安装**正式签名的版本，需先卸载。"
              echo "> ⚠️ **English**: this build is signed with the committed debug keystore (release signing secrets are not configured). It can **not** update an install signed with the release key."
              echo
            fi
            echo "### 本 fork 相对官方 2dust/v2rayNG 的差异 / Fork highlights"
            echo "- 本地入站完全可配置（Mixed / SOCKS+HTTP / 仅 SOCKS / 仅 HTTP、监听地址、认证、透明代理端口），CUSTOM 配置同样注入。"
            echo "  Fully configurable local inbounds (mixed / socks+http / socks / http, listen address, auth, transparent redirect); the same layout is injected into CUSTOM profiles."
            echo "- 「本地代理 · 直连」：不选节点也能启动核心，本地端口照常监听，出站为 freedom；VPN 模式下启动直连会自动改为仅代理。"
            echo "  \"Local proxy · Direct\" starts the core without a remote node; a direct start in VPN mode switches to proxy-only automatically."
            echo "- 本地入站认证开关与凭据解耦；凭据不全时开关不会显示为已启用。"
            echo "  The local auth toggle is decoupled from the credential fields; incomplete credentials never look enabled."
            echo "- 应用内「检查更新 / 关于 / 反馈」指向本仓库 chaogei/v2rayNG-Plus。"
            echo "  The in-app update checker, about page and feedback links point at this fork."
            echo
            echo "### 变更 / Changes (since ${SINCE_LABEL})"
            echo "$COMMITS"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: v2rayNG-Plus ${{ needs.build.outputs.version_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.build.outputs.signed != 'true' }}
          files: release-files/*
